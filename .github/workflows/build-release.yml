name: Build & Release

# Manual, on-demand build of Windows + Linux binaries, published to GitHub Releases.
#
# The recompilation step (BUILDING.md step 3) needs the actual game ROM to translate
# into C, and the port also reads the ROM at runtime for assets. The ROM is
# copyrighted and is never committed to this repo (see .gitignore) — GitHub Actions
# secrets are capped at 48 KB, far too small for an 8 MiB ROM, so it can't be stored
# as a secret directly. Instead it lives in a separate *private* companion repo
# (ROM_ASSETS_REPO) and is checked out during the build using a fine-grained PAT
# (ROM_ASSETS_PAT) scoped to read-only access on that one repo. It is never uploaded
# as part of any artifact or release asset: downstream users must supply their own
# legally dumped USA or Japan Rev A ROM to run the released binary.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true
      draft:
        description: "Create the release as a draft (review before publishing)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  ROM_FILENAME: "AeroGauge (USA).z64"
  JAPAN_ROM_FILENAME: "AeroGauge (Japan) (Rev A).n64"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin checkout to the immutable tag — defense in depth alongside
          # the dispatcher's `--ref "${VERSION}"` argument. Guarantees the
          # compiled binary matches the tagged source even if someone lands
          # a commit on main between tag creation and dispatch.
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 pkg-config \
            libsdl2-dev libvulkan-dev libfreetype-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libdbus-1-dev

      - name: Check ROM asset config
        env:
          ROM_ASSETS_REPO: ${{ vars.ROM_ASSETS_REPO }}
          ROM_ASSETS_PAT: ${{ secrets.ROM_ASSETS_PAT }}
        run: |
          if [ -z "$ROM_ASSETS_REPO" ] || [ -z "$ROM_ASSETS_PAT" ]; then
            echo "::error::vars.ROM_ASSETS_REPO and/or secrets.ROM_ASSETS_PAT are not set — cannot recompile without a ROM."
            exit 1
          fi

      - name: Fetch ROM from private assets repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ROM_ASSETS_REPO }}
          token: ${{ secrets.ROM_ASSETS_PAT }}
          path: rom-assets

      - name: Place ROM
        run: |
          cp "rom-assets/$ROM_FILENAME" "./$ROM_FILENAME"
          cp "rom-assets/$JAPAN_ROM_FILENAME" "./$JAPAN_ROM_FILENAME"
          rm -rf rom-assets

      - name: Reset submodules before patching
        # Defensive: a previous run that patched partially would otherwise
        # leave the next apply failing with "patch failed: ...". The Linux
        # build script then re-applies its pinned patch sequence idempotently.
        run: |
          git -C lib/N64ModernRuntime checkout -- .
          git -C lib/RecompFrontend checkout -- .
          git -C lib/rt64 checkout -- .
          git -C lib/rt64/src/contrib/plume checkout -- . 2>/dev/null || true

      - name: Build via shared script
        # Delegate to build.sh — the single source of truth for the build
        # sequence (submodule reset, patch apply, configure x2, build tools,
        # recompile, link). CI doesn't reimplement any of this inline; if
        # the local script drifts, this job breaks on the next push, so the
        # hookify rule (patch→build drift) catches it.
        env:
          ROM_FILENAME: ${{ env.ROM_FILENAME }}
        run: bash build.sh

      - name: Verify audio task submission
        run: |
          cmake --build build --target test_rsp_submission -j2
          ctest --test-dir build -R '^rsp_task_submission$' --output-on-failure --no-tests=error

      - name: Remove ROM before packaging
        if: always()
        run: rm -f "$ROM_FILENAME" "$JAPAN_ROM_FILENAME" "AeroGauge (Japan) (Rev A).z64"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/aerogauge_modern dist/
          cp -r build/assets dist/
          cp scripts/install_linux_launcher.sh dist/
          # Symbol table: probed next to the exe at runtime so field crash
          # dumps show function names, not raw N64 PCs.
          cp aerogauge.syms.toml aerogauge.jp.syms.toml dist/
          cd dist && zip -r ../aerogauge-recomp-linux-x64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerogauge-recomp-linux-x64
          path: aerogauge-recomp-linux-x64.zip
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        # RT64's contrib tree contains paths > 260 chars; Windows runners
        # reject these without this flag set.
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin checkout to the immutable tag — defense in depth alongside
          # the dispatcher's `--ref "${VERSION}"` argument. Guarantees the
          # compiled binary matches the tagged source even if someone lands
          # a commit on main between tag creation and dispatch.
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Install MinGW-w64 GCC, CMake, Ninja
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          choco install ninja -y --no-progress
          python -m pip install --upgrade pip
          python -m pip install cmake
          # Put a MinGW-w64 GCC ahead of any MSYS2 toolchain that might also be on PATH.
          echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          gcc --version
          cmake --version
          ninja --version

      - name: Check ROM asset config
        shell: pwsh
        env:
          ROM_ASSETS_REPO: ${{ vars.ROM_ASSETS_REPO }}
          ROM_ASSETS_PAT: ${{ secrets.ROM_ASSETS_PAT }}
        run: |
          if (-not $env:ROM_ASSETS_REPO -or -not $env:ROM_ASSETS_PAT) {
            Write-Error "vars.ROM_ASSETS_REPO and/or secrets.ROM_ASSETS_PAT are not set -- cannot recompile without a ROM."
            exit 1
          }

      - name: Fetch ROM from private assets repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ROM_ASSETS_REPO }}
          token: ${{ secrets.ROM_ASSETS_PAT }}
          path: rom-assets

      - name: Place ROM
        shell: pwsh
        run: |
          Copy-Item "rom-assets\$env:ROM_FILENAME" ".\$env:ROM_FILENAME"
          Copy-Item "rom-assets\$env:JAPAN_ROM_FILENAME" ".\$env:JAPAN_ROM_FILENAME"
          Remove-Item -Recurse -Force rom-assets

      - name: Reset submodules before patching
        shell: pwsh
        # Defensive: a previous run that patched partially would otherwise
        # leave the next apply failing with "patch failed: ...". The Windows
        # build script then re-applies its pinned patch sequence idempotently.
        # autocrlf=false also neutralises CRLF the Windows runner's git
        # might inject.
        run: |
          git config --global core.autocrlf false
          git -C lib/N64ModernRuntime checkout -- .
          git -C lib/RecompFrontend checkout -- .
          git -C lib/rt64 checkout -- .
          git -C lib/rt64/src/contrib/plume checkout -- .

      - name: Build via shared script
        shell: pwsh
        # Delegate to build.ps1 — the single source of truth for the build
        # sequence. -RomPath forwards the workflow's $env:ROM_FILENAME so a
        # future ROM rename stays single-sourced in the workflow's env block.
        env:
          ROM_FILENAME: ${{ env.ROM_FILENAME }}
        run: ./build.ps1 -RomPath "$env:ROM_FILENAME"

      - name: Verify audio task submission
        shell: pwsh
        run: |
          cmake --build build --target test_rsp_submission -j2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -R '^rsp_task_submission$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove ROM before packaging
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:ROM_FILENAME", "$env:JAPAN_ROM_FILENAME", "AeroGauge (Japan) (Rev A).z64"

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          # RT64 dlopen()s dxcompiler/dxil at D3D12 init and SDL2 is a dynamic dep,
          # so a missing DLL crashes on the user's machine at startup, not here.
          # Fail the build loudly if any required file is absent instead of
          # shipping a broken zip. aerogauge.syms.toml is shipped so field crash
          # reports resolve guest PCs to function names.
          $payload = @(
            'build\aerogauge_modern.exe',
            'build\SDL2.dll',
            'build\freetype.dll',
            'build\assets',
            'build\dxcompiler.dll',
            'build\dxil.dll',
            'aerogauge.syms.toml',
            'aerogauge.jp.syms.toml'
          )
          $missing = $payload | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Packaging aborted -- required files missing: $($missing -join ', ')" }
          Copy-Item -Recurse $payload dist\
          Compress-Archive -Path dist\* -DestinationPath aerogauge-recomp-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aerogauge-recomp-windows-x64
          path: aerogauge-recomp-windows-x64.zip
          retention-days: 14

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check Android signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing $key. Configure Android release signing as described in docs/android.md."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # v3 is unmaintained and fails its own bootstrap against the current
        # SDK repository: it runs `sdkmanager tools`, and the legacy `tools`
        # package no longer exists, so the job dies before installing anything.
        # v4.0.2 fixed exactly that ("Fix for removed tools package"), and
        # v4 defaults to a current cmdline-tools.
        uses: android-actions/setup-android@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'

      - name: Fetch ROM from private assets repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ROM_ASSETS_REPO }}
          token: ${{ secrets.ROM_ASSETS_PAT }}
          path: rom-assets

      - name: Build and verify signed APK
        env:
          AERO_VERSION: ${{ inputs.tag }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cp "rom-assets/$ROM_FILENAME" "./$ROM_FILENAME"
          cp "rom-assets/$JAPAN_ROM_FILENAME" "./$JAPAN_ROM_FILENAME"
          python3 scripts/build_android.py --release
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/aerogauge-recomp-android-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 dist/aerogauge-recomp-android-arm64.apk

      - name: Remove private build inputs
        if: always()
        run: |
          rm -f "$ROM_FILENAME" "$JAPAN_ROM_FILENAME" "AeroGauge (Japan) (Rev A).z64" "$RUNNER_TEMP/android-release.jks"
          rm -rf rom-assets

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aerogauge-recomp-android-arm64
          path: dist/aerogauge-recomp-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            artifacts/aerogauge-recomp-linux-x64/aerogauge-recomp-linux-x64.zip \
            artifacts/aerogauge-recomp-windows-x64/aerogauge-recomp-windows-x64.zip \
            artifacts/aerogauge-recomp-android-arm64/aerogauge-recomp-android-arm64.apk \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.tag }}" \
            $( [ "${{ inputs.prerelease }}" = "true" ] && echo --prerelease ) \
            $( [ "${{ inputs.draft }}" = "true" ] && echo --draft ) \
            --notes "Automated build from commit ${{ github.sha }}. **You must supply your own legally-dumped USA or Japan Rev A ROM next to the desktop executable, or import it from the Android launcher — this project ships no game data.** See BUILDING.md and docs/android.md."
