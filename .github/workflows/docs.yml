name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint workflows and inline shell scripts
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=shellcheck
      - name: Check dependency patch inventory
        run: python3 -B scripts/dependency_patches.py --check
      - name: Check shared patch application
        run: python3 -B tests/test_dependency_patches.py
      - name: Check generated-file protection
        run: python3 -B tests/test_generated_files.py
      - name: Check host test registration guard
        run: python3 -B tests/test_host_checks.py
      - name: Check Android build regressions
        run: python3 -B tests/test_android_build.py
      - name: Check documentation
        run: python3 scripts/check_docs.py
      - name: Check whitespace (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}..HEAD"
      - name: Check whitespace (push)
        if: github.event_name != 'pull_request'
        run: git diff --check "HEAD~1..HEAD"

  host-tests:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure without ROMs, submodules, or renderer
        run: cmake -S . -B build/host-checks -DAERO_HOST_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build host tests
        run: cmake --build build/host-checks --config Release --parallel 2
      - name: Verify registration and run host tests
        run: python -B scripts/check_host_tests.py build/host-checks
