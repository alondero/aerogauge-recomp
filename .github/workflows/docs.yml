name: Documentation checks

on:
  push:
    paths:
      - "*.md"
      - "docs/**"
      - "assets/**"
      - "cmake/**"
      - "patches/**"
      - ".claude/**"
      - "scripts/check_docs.py"
      - "CMakeLists.txt"
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "src/**"
      - "include/**"
  pull_request:
    paths:
      - "*.md"
      - "docs/**"
      - "assets/**"
      - "cmake/**"
      - "patches/**"
      - ".claude/**"
      - "scripts/check_docs.py"
      - "CMakeLists.txt"
      - ".github/workflows/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "src/**"
      - "include/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint workflows and inline shell scripts
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=shellcheck
      - name: Check documentation
        run: python3 scripts/check_docs.py
      - name: Check whitespace (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}..HEAD"
      - name: Check whitespace (push)
        if: github.event_name != 'pull_request'
        run: git diff --check "HEAD~1..HEAD"
