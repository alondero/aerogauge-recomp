plugins { id 'com.android.application' }

def repoRoot = rootProject.projectDir.parentFile
def releaseVersion = System.getenv('AERO_VERSION') ?: '0.1.0'
def versionMatch = releaseVersion =~ /^v?(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/
if (!versionMatch.matches()) throw new GradleException('AERO_VERSION must be a semantic version')
def parts = (1..3).collect { versionMatch.group(it).toInteger() }
if (parts[1] > 999 || parts[2] > 999) throw new GradleException('Version components must fit the APK version code')

android {
    namespace 'io.github.alondero.aerogaugerecomp'
    compileSdk 35
    lint { lintConfig file('../lint.xml') }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'io.github.alondero.aerogaugerecomp'
        minSdk 28
        targetSdk 35
        versionCode parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        versionName releaseVersion.replaceFirst('^v', '')
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    sourceSets.main {
        java.srcDir "${repoRoot}/build-android/deps/SDL/android-project/app/src/main/java"
        jniLibs.srcDir "${repoRoot}/build-android/package/jniLibs"
        assets.srcDir "${repoRoot}/build-android/package/assets"
    }
    packagingOptions.jniLibs.useLegacyPackaging = true // AdrenoTools loads extracted hooks.
}

tasks.register('checkReleaseSigning') {
    doLast {
        ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].each {
            if (!System.getenv(it)) throw new GradleException("Release signing requires ${it}")
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'checkReleaseSigning' }
